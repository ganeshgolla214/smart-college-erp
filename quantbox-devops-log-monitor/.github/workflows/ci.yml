name: log-monitor-ci

on:
  push:
    paths:
      - "quantbox-devops-log-monitor/**"
  pull_request:
    paths:
      - "quantbox-devops-log-monitor/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantbox-devops-log-monitor
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m py_compile scripts/log_analyzer.py

      - name: Run analyzer
        run: |
          set +e
          python3 scripts/log_analyzer.py sample/app.log
          code=$?
          test "$code" -eq 2

      - name: Shell syntax check
        run: bash -n scripts/monitor.sh
