services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: college_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports: ["5432:5432"]
    volumes: [erp-data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/college_erp
      SPRING_DATASOURCE_USERNAME: erp
      SPRING_DATASOURCE_PASSWORD: erp
      APP_JWT_SECRET: change-this-development-secret-change-this-development-secret
    ports: ["8080:8080"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  erp-data:
